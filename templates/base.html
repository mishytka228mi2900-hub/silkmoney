<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="{{ url_for('static', filename='scripts/script.js') }}"></script>
    <title>{% block title %} {% endblock %}</title>
</head>

<body>
    <header>
        <div class="top-content">
            <div class="header-menu">
                <nav class="menu_body">
                    <ul class="menu-list">
                        <li class="name-text" style="font-weight: 400;">Silk&money</li>
                        <div class="menu-right">
                            <li class="menu-item"><a href="/" class="top-a">Главная</a></li>
                            <li class="menu-item"><a href="{{url_for('order')}}" class="top-a">Заказать</a></li>
                            <li class="menu-item"><a href="#" class="top-a copy-link">+375(29)5832964</a></li>
                        </div>
                    </ul>
                </nav>
            </div>

            <div style="margin-bottom: 0px;" class="top-content-mobile">
                <a href="{{url_for('index')}}" class="name-text-mobile top-a">S&m</a>
                <a href="{{url_for('order')}}" class="name-text-mobile top-a">Заказать</a>
            </div>
        </div>
    </header>


    <div class="content-container">
        <div class="content">
            {% block content %} {% endblock %}
        </div>
    </div>


    <footer class="footer-simple">
        <div class="footer-simple-content">
            <div class="footer-simple-left">
                <p>&copy; 2026 Silk&Money</p>
            </div>
            <div class="footer-simple-right">
                <p>Сайт не является интернет-магазином</p>
                <a href="{{ url_for('order') }}" class="top-a">Контакты</a>
                <a href="{{ url_for('politica_konfidencialnosti') }}" class="top-a">Политика конфиденциальности</a>
            </div>
        </div>
    </footer>

    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</body>

</html>
